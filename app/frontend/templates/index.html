{% extends "base.html" %} {% block title %} Home {% endblock %} {% block content
%}

<h1>Khai phá dữ liệu nhân quả</h1>

<div class="container-fluid">
  <h3 class="mt-5">Tập dữ liệu hiện có</h3>
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Tên</th>
        <th scope="col">Trạng thái</th>
        <th scope="col">Ngày tạo</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">1</th>
        <td>Mark</td>
        <td>Otto</td>
        <td>@mdo</td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>Jacob</td>
        <td>Thornton</td>
        <td>@fat</td>
      </tr>
      <tr>
        <th scope="row">3</th>
        <td>John</td>
        <td>Doe</td>
        <td>@social</td>
      </tr>
    </tbody>
  </table>

  <button
    type="button"
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#createDataModal"
  >
    Thêm tập dữ liệu
  </button>
</div>
<div
  class="modal fade"
  id="createDataModal"
  tabindex="-1"
  aria-labelledby="createDataModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="createDataModalLabel">Thêm tập dữ liệu</h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <form method="post" enctype="multipart/form-data">
        <div class="modal-body">
          <div class="mb-3">
            <label for="dataName" class="form-label"> Tên tập dữ liệu </label>

            <input
              type="text"
              class="form-control"
              id="dataName"
              name="data_name"
              placeholder="Nhập tên tập dữ liệu"
            />
          </div>

          <div class="mb-3">
            <label for="description" class="form-label"> Tải lên </label>

            <input
              type="file"
              class="form-control"
              id="dataFile"
              name="data_file"
              accept=".txt"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Hủy
          </button>

          <button type="submit" class="btn btn-primary">Thêm</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
