<div id="graph-detail" style="position:fixed;right:0;top:0;width:360px;height:100%;
     overflow-y:auto;background:#fff;border-left:1px solid #ccc;padding:12px;
     display:none;font-family:sans-serif;font-size:13px;z-index:9999;">
  <button onclick="document.getElementById('graph-detail').style.display='none'">✕</button>
  <div id="graph-detail-body"></div>
</div>
<style>
  .detail-section { margin-top:14px; padding:8px 10px; border-left:4px solid; border-radius:4px; }
  .detail-section h4 { margin:0 0 4px 0; }
  .detail-section.positive { border-color:#2ecc71; background:#eafaf1; }
  .detail-section.negative { border-color:#f1c40f; background:#fef9e7; }
  .detail-section.neutral { border-color:#3498db; background:#eaf2fb; }
  .relation-item { margin-top:8px; padding-top:8px; border-top:1px dashed #ccc; }
  .relation-item:first-child { margin-top:0; padding-top:0; border-top:none; }
  .relation-title { font-weight:bold; font-size:14px; }
</style>
<script>
  function textFragmentUrl(url, sentence) {
    var excerpt = (sentence || "").trim().split(/\s+/).slice(0, 12).join(" ");
    return url + "#:~:text=" + encodeURIComponent(excerpt);
  }

  var DIRECTION_GROUPS = [
    { key: 1, className: "positive", label: "Tác động dương" },
    { key: -1, className: "negative", label: "Tác động âm" },
    { key: 0, className: "neutral", label: "Chưa xác định" },
  ];

  function relationDirection(value) {
    return value === 1 || value === -1 ? value : 0;
  }

  function relationDirectionForNode(nodeId, edge, r) {
    if (edge.from === nodeId) return relationDirection(r.source_direction);
    if (edge.to === nodeId) return relationDirection(r.target_direction);
    return 0;
  }

  function renderRelation(r) {
    var html = "<i>" + r.original_sentence + "</i>";
    html += "<br><small>(" + "<b>" + r.subject_text + "</b> — " + r.predicate +
            " — <b>" + r.object_text + "</b>" + ")</small>";

    if (r.url) {
      html += "<br><a href='" + textFragmentUrl(r.url, r.original_sentence) +
              "' target='_blank' rel='noopener'>🔗 Xem nguồn</a>";
    }
    return html;
  }

  function renderRelationItem(edge, r) {
    return "<div class='relation-item'><span class='relation-title'>" + edge.from + " → " + edge.to + "</span><br>" +
           renderRelation(r) + "</div>";
  }

  function renderEdgeDetail(edgeId) {
    var edge = edges.get(edgeId);
    var rels = edge.relations || [];
    var html = "<h3>" + edge.from + " → " + edge.to + "</h3>";
    rels.forEach(function (r) {
      html += "<div class='relation-item'>" + renderRelation(r) + "</div>";
    });
    return html;
  }

  function renderNodeDetail(nodeId) {
    var node = nodes.get(nodeId);
    var groups = { 1: [], "-1": [], 0: [] };

    network.getConnectedEdges(nodeId).forEach(function (edgeId) {
      var edge = edges.get(edgeId);
      var rels = edge.relations || [];
      rels.forEach(function (r) {
        var direction = relationDirectionForNode(nodeId, edge, r);
        groups[direction].push({ edge: edge, relation: r });
      });
    });

    var html = "<h3>" + node.label + "</h3>";
    html += "<p>Trạng thái: " + (node.direction_state || "neutral") + "</p>";

    DIRECTION_GROUPS.forEach(function (group) {
      var items = groups[group.key];
      if (items.length === 0) return;
      html += "<div class='detail-section " + group.className + "'>";
      html += "<h4>" + group.label + " (" + items.length + ")</h4>";
      items.forEach(function (item) {
        html += renderRelationItem(item.edge, item.relation);
      });
      html += "</div>";
    });

    return html;
  }

  function showDetail(html) {
    document.getElementById("graph-detail-body").innerHTML = html;
    document.getElementById("graph-detail").style.display = "block";
  }

  network.on("click", function (params) {
    if (params.nodes.length > 0) {
      showDetail(renderNodeDetail(params.nodes[0]));
    } else if (params.edges.length > 0) {
      showDetail(renderEdgeDetail(params.edges[0]));
    }
  });
</script>
