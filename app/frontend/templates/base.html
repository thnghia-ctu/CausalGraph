<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title>{% block title %}Personal Pipeline App{% endblock %}</title>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css"/>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/htmx.min.js"></script>
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- Sidebar -->
      <aside class="border-end p-3 flex-shrink-0 position-sticky align-self-start" style="width: 250px; top: 2rem;">

        <nav class="navbar navbar-light p-0 ">
          <div class="nav nav-pills flex-column w-100">
            <a href="/" class="nav-link fw-bold px-2 {% if request.url.path == '/' %}active{% else %}text-dark{% endif %}"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Bộ dữ liệu</a>

            {% if selected_dataset_name %}
              <div class="border-top mt-3 pt-3">
                <div class="text-primary fw-bold fs-5 mb-3 px-2">{{ selected_dataset_name }}</div>
                <a href="/filter" class="nav-link border-start border-dark rounded fw-bold px-2 py-2 mb-1 {% if request.url.path == '/filter' %}active{% else %}bg-light text-dark{% endif %}"{% if request.url.path == '/filter' %} aria-current="page"{% endif %}>Lọc dữ liệu</a>

                <a href="/ingest" class="nav-link border-start border-dark rounded fw-bold px-2 py-2 mb-1 {% if request.url.path == '/ingest' %}active{% else %}bg-light text-dark{% endif %}"{% if request.url.path == '/ingest' %} aria-current="page"{% endif %}>Xử lý dữ liệu</a>
                <a href="/graph" class="nav-link border-start border-dark rounded fw-bold px-2 py-2 {% if request.url.path == '/graph' %}active{% else %}bg-light text-dark{% endif %}"{% if request.url.path == '/graph' %} aria-current="page"{% endif %}>Giao diện đồ thị</a>
              </div>
            {% else %}
              <div class="border-top mt-3 pt-3">
                <div class="text-dark fw-bold px-2">Chưa chọn tập dữ liệu</div>
              </div>
            {% endif %}
          </div>
        </nav>

        {% block sidebar_extra %}{% endblock %}
      </aside>

      <!-- Page content -->
      <main class="flex-grow-1 p-4">{% block content %} {% endblock %}</main>
    </div>

  </body>
</html>
